  <circle cx="60" cy="34" r="2" fill="#E05300"/>
  <path d="M48 42 C48 38, 52 35, 56 35" fill="none" stroke="#FF5100" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Mountain Peaks in Background -->
