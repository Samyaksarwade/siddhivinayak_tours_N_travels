      <stop offset="0%" stop-color="#FF8A33" />
      <stop offset="100%" stop-color="#FF5100" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>
  <!-- Background Sun / Halo -->
  <circle cx="60" cy="55" r="42" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
  <path d="M25 60 C35 30, 85 30, 95 60" fill="none" stroke="url(#saffronGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Auspicious Mandir Kalash Silhouette -->
  <path d="M60 16 L65 26 L55 26 Z" fill="#FF5100"/>
  <circle cx="60" cy="14" r="3" fill="#E05300"/>
  
  <!-- Ganesha Trunk / Iconography -->
